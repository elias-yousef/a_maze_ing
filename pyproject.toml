[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator, solver, and renderer"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [
    {name = "eabushak"},
    {name = "aabuzanh"}
]

[tool.setuptools.packages.find]
include = ["mazegen*"]
